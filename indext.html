    margin: 0;
    padding: 20px;
    background-color: #f1f5f9;
    color: var(--text-main);
  }
  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    overflow: hidden;
  }
  .header {
    background: #1e293b;
    color: #fff;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }
  .description {
    padding: 12px 24px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--text-muted);
  }
  .table-wrapper {
    overflow-x: auto;
    padding: 16px 24px;
  }
  table.calc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    background: #fff;
  }
  table.calc-table th, table.calc-table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: center;
    vertical-align: middle;
  }
  table.calc-table th {
    background: var(--bg-header);
    font-weight: 600;
    white-space: nowrap;
  }
  .row-header {
    background: #f1f5f9;
    font-weight: 600;
    text-align: left !important;
    width: 220px;
    min-width: 200px;
  }
  .section-divider {
    background: #e2e8f0;
    font-weight: bold;
    text-align: center !important;
    color: #334155;
    padding: 8px !important;
  }
  .auto-calc-section {
    background: #e0f2fe;
    font-weight: bold;
    text-align: center !important;
    color: #0369a1;
    padding: 10px !important;
  }
  input[type="text"], input[type="date"], select {
    width: 100%;
    min-width: 140px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
    background: #fff;
  }
  input[type="number"] {
    width: 100%;
    min-width: 80px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
    text-align: right;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
  }
  .calculated-cell {
    background: #f8fafc;
    font-weight: 500;
    text-align: right !important;
  }
  .total-row td {
    background: #fef2f2;
    font-weight: bold;
    font-size: 14px;
    color: #991b1b;
  }
  .total-cell {
    text-align: right !important;
  }
  .action-btns {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  button.btn {
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
    font-size: 13px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #64748b; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary:hover { background: #475569; }
</style>
</head>

  </div>

  <div class="table-wrapper">

function getDaysInMonth(year, monthIndex) {
  return new Date(year, monthIndex + 1, 0).getDate();
}

function calcRemainingDays(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return 0;
  const year = d.getFullYear();
  const month = d.getMonth();
  const day = d.getDate();
  const totalDays = getDaysInMonth(year, month);
  return Math.max(1, totalDays - day + 1);
}

function getPlanFee(planName) {
  for (let c in PLANS) {
    let p = PLANS[c].find(x => x.name === planName);
    if (p) return p.fee;
  }
  return 0;
}

function getDisc1Fee(discName) {
  let d = DISCOUNTS_1.find(x => x.name === discName);
  return d ? d.fee : 0;
}

function getDisc2Fee(discName) {

}

function getOptFee(optName) {

function renderInput(rowDef, colData, cIdx) {
  const val = colData[rowDef.key] !== undefined ? colData[rowDef.key] : '';
  switch(rowDef.inputType) {
    case "text":
      return `<input type="text" value="${htmlEscape(val)}" onchange="updateVal(${cIdx}, '${rowDef.key}', this.value)">`;
    case "number":
      return `<input type="number" value="${val}" onchange="updateVal(${cIdx}, '${rowDef.key}', parseFloat(this.value)||0)">`;
    case "date":
      return `<input type="date" value="${val}" onchange="updateVal(${cIdx}, '${rowDef.key}', this.value)">`;
    case "carrier-select":
      return `<select onchange="updateCarrier(${cIdx}, this.value)">
        ${Object.keys(PLANS).map(c => `<option value="${c}" ${c === val ? 'selected' : ''}>${c}</option>`).join('')}
      </select>`;
    case "plan-select":
    case "post-plan-select":
      let carrier = colData.carrier || "UQ";
      let pList = PLANS[carrier] || [];
      return `<select onchange="updateVal(${cIdx}, '${rowDef.key}', this.value)">
        ${pList.map(p => `<option value="${p.name}" ${p.name === val ? 'selected' : ''}>${p.name}</option>`).join('')}

    case "family-select":
    case "post-family-select":

        ${FAMILY_DISCOUNTS.map(f => `<option value="${f.name}" ${f.name === val ? 'selected' : ''}>${f.name}</option>`).join('')}
      </select>`;
    case "disc1-select":
    case "post-disc1-select":
      return `<select onchange="updateVal(${cIdx}, '${rowDef.key}', this.value)">
        ${DISCOUNTS_1.map(d => `<option value="${d.name}" ${d.name === val ? 'selected' : ''}>${d.name}</option>`).join('')}
      </select>`;
    case "disc2-select":
    case "post-disc2-select":
      return `<select onchange="updateVal(${cIdx}, '${rowDef.key}', this.value)">
        ${DISCOUNTS_2.map(d => `<option value="${d.name}" ${d.name === val ? 'selected' : ''}>${d.name}</option>`).join('')}
      </select>`;
    case "opt-select":
      return `<select onchange="updateVal(${cIdx}, '${rowDef.key}', this.value)">
        ${OPTIONS.map(o => `<option value="${o.name}" ${o.name === val ? 'selected' : ''}>${o.name}</option>`).join('')}
      </select>`;
    default:
      return '';
  }
}

function htmlEscape(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function updateVal(colIdx, key, val) {
  columnsData[colIdx][key] = val;
  calculateAll();
}

function updateCarrier(colIdx, carrier) {
  columnsData[colIdx].carrier = carrier;
  let pList = PLANS[carrier] || [];
  if (pList.length > 0) {
    columnsData[colIdx].plan = pList[0].name;
    columnsData[colIdx].postPlan = pList[0].name;
  }
  renderTable();
}

function formatYen(num) {
  return "¥" + Math.round(num).toLocaleString('ja-JP');
}

function calculateAll() {
  columnsData.forEach((col, idx) => {
    // 料金基本
    const planFee = getPlanFee(col.plan);
    const postPlanFee = getPlanFee(col.postPlan);
    const disc1Fee = getDisc1Fee(col.disc1);
    const disc2Fee = getDisc2Fee(col.disc2);
    const postDisc1Fee = getDisc1Fee(col.postDisc1);
    const postDisc2Fee = getDisc2Fee(col.postDisc2);

    const opt1Fee = getOptFee(col.opt1);
    const opt2Fee = getOptFee(col.opt2);
    const opt3Fee = getOptFee(col.opt3);

    const opt1Total = opt1Fee * (col.opt1Months || 0) * (col.opt1Lines || 0);
    const opt2Total = opt2Fee * (col.opt2Months || 0) * (col.opt2Lines || 0);
    const opt3Total = opt3Fee * (col.opt3Months || 0) * (col.opt3Lines || 0);

    const remainingDays = calcRemainingDays(col.contractDate);
    const totalDaysInMonth = col.contractDate ? getDaysInMonth(new Date(col.contractDate).getFullYear(), new Date(col.contractDate).getMonth()) : 30;

    // 日割計算 (日割り料金 = 月額 * 残日数 / 月日数)
    const prorateRatio = remainingDays / totalDaysInMonth;
    const prorateNoFamilyPlan = Math.round(planFee * prorateRatio * (col.linesNoFamily || 0));
    const prorateFamilyPlan = Math.round(planFee * prorateRatio * (col.linesFamily || 0));

    // 事務手数料
    const totalAdminFee = (col.adminFeePerLine || 0) * ((col.linesNoFamily || 0) + (col.linesFamily || 0));

    // 2ヶ月目以降（初期契約月数分）
    const initial2ndNoFamilyPlan = planFee * (col.initialMonths || 0) * (col.linesNoFamily || 0);
    const initial2ndFamilyPlan = planFee * (col.initialMonths || 0) * (col.linesFamily || 0);

    // 変更後 割引合計
    const postNoFamilyDisc1 = postDisc1Fee * (col.postMonths || 0) * (col.linesNoFamily || 0);
    const postFamilyDisc1 = postDisc1Fee * (col.postMonths || 0) * (col.linesFamily || 0);
    const postNoFamilyDisc2 = postDisc2Fee * (col.postMonths || 0) * (col.linesNoFamily || 0);
    const postFamilyDisc2 = postDisc2Fee * (col.postMonths || 0) * (col.linesFamily || 0);

    // 通信費 合計金額
    const grandTotal = totalAdminFee 
      + prorateNoFamilyPlan + prorateFamilyPlan
      + initial2ndNoFamilyPlan + initial2ndFamilyPlan
      + postNoFamilyDisc1 + postFamilyDisc1
      + postNoFamilyDisc2 + postFamilyDisc2
      + opt1Total + opt2Total + opt3Total;

    // DOMへの反映
    setCell(`planFee_${idx}`, formatYen(planFee));
    setCell(`familyDiscFee_${idx}`, "¥0");
    setCell(`disc1Fee_${idx}`, formatYen(disc1Fee));
    setCell(`disc2Fee_${idx}`, formatYen(disc2Fee));

    setCell(`postPlanFee_${idx}`, formatYen(postPlanFee));
    setCell(`postFamilyDiscFee_${idx}`, "¥0");
    setCell(`postDisc1Fee_${idx}`, formatYen(postDisc1Fee));
    setCell(`postDisc2Fee_${idx}`, formatYen(postDisc2Fee));

    setCell(`opt1Total_${idx}`, formatYen(opt1Total));
    setCell(`opt2Total_${idx}`, formatYen(opt2Total));
    setCell(`opt3Total_${idx}`, formatYen(opt3Total));

    setCell(`prorateDays_${idx}`, `${remainingDays}日`);
    setCell(`prorateNoFamilyPlan_${idx}`, formatYen(prorateNoFamilyPlan));
    setCell(`prorateFamilyPlan_${idx}`, formatYen(prorateFamilyPlan));
    setCell(`totalAdminFee_${idx}`, formatYen(totalAdminFee));

    setCell(`initial2ndNoFamilyPlan_${idx}`, formatYen(initial2ndNoFamilyPlan));
    setCell(`initial2ndFamilyPlan_${idx}`, formatYen(initial2ndFamilyPlan));

    setCell(`postNoFamilyDisc1_${idx}`, formatYen(postNoFamilyDisc1));
    setCell(`postFamilyDisc1_${idx}`, formatYen(postFamilyDisc1));
    setCell(`postNoFamilyDisc2_${idx}`, formatYen(postNoFamilyDisc2));
    setCell(`postFamilyDisc2_${idx}`, formatYen(postFamilyDisc2));

    setCell(`grandTotal_${idx}`, formatYen(grandTotal));
  });
}

function setCell(id, text) {
  const el = document.getElementById("cell_" + id);
  if (el) el.innerText = text;
}

function addColumn() {
  columnsData.push({
    name: `新規社員 ${columnsData.length + 1}`,
    carrier: "UQ",
    plan: "トクトクプラン2~30GB",
    familyDisc: "なし",
    disc1: "なし",
    disc2: "なし",
    postPlan: "トクトクプラン2~30GB",
    postFamilyDisc: "なし",
    postDisc1: "なし",
    postDisc2: "なし",
    opt1: "なし", opt1Months: 0, opt1Lines: 0,
    opt2: "なし", opt2Months: 0, opt2Lines: 0,
    opt3: "なし", opt3Months: 0, opt3Lines: 0,
    linesNoFamily: 1,
    linesFamily: 0,
    adminFeePerLine: 3850,
    contractDate: new Date().toISOString().split('T')[0],
    initialMonths: 1,
    postMonths: 1
  });
  renderTable();
}

function removeColumn(idx) {
  if (columnsData.length <= 1) {
    alert("最低1列は必要です。");
    return;
  }
  columnsData.splice(idx, 1);
  renderTable();
}

function resetToSample() {
  location.reload();
}

// 初回レンダリング
window.onload = () => {
  renderTable();
};
</script>
